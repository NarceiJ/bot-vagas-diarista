name: Bot Diarista OLX e Indeed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar o robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.8900930532:AAFkm43xk9i53owSXEpcrxJRuFBvv9EkiR0}}
          TELEGRAM_CHAT_ID: ${{ secrets.6682065062 }}
        run: python monitor_vagas.py

      - name: Commit e Push de vagas vistas (se houver atualização)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vagas_vistas.json
          git commit -m "Atualiza histórico de vagas vistas" || echo "Sem novas alterações para commitar"
          git push
